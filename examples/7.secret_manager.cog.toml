name = "secret manager example"

# a `gcpsm://` path resolves a variable against Google Secret Manager rather than a document.
# authentication uses Application Default Credentials, the same credential path that
# KMS-backed SOPS decryption already relies on:
#   gcloud auth application-default login
#
# this example is not run by e2e.sh: it needs real credentials and real secrets.
# to try it against your own project:
#   PROJECT=my-project cogs gen gsm ./examples/7.secret_manager.cog.toml -e

# a GSM link is expressed with the three link fields cogs already has:
#   path[0]  store + project - "gcpsm://<project>"
#   path[1]  version or alias - "latest", "current", "7"
#   name     the secret id
#
# project and version alias are usually shared at the ctx level, leaving only the
# secret id to vary per var. `path = []` inherits both.
[gsm.enc]
path = ["gcpsm://${PROJECT}", "latest"]

[gsm.enc.vars]
# `path = []` is required even though both halves are inherited: omitting the key
# entirely is how cogs catches a var that was meant to hold a literal value
db_password = {path = [], name = "my-service-db-password-qa"}
api_key = {path = [], name = "my-service-api-key-qa"}

# a one-off var with no group to share with gives all three fields inline
[gsm_standalone.enc.vars]
other_password = {path = ["gcpsm://other-project", "current"], name = "other-db-password"}

# notes:
# - the payload is assigned verbatim, so `type` is rejected on a GSM link and a
#   value like "p@ss: word" stays a string rather than being parsed as YAML
# - a single trailing newline is trimmed, so a secret stored with one does not
#   corrupt values such as PGPASSWORD
# - vars pointing at the same project/secret/version are fetched once
# - --no-decrypt still fetches: there is no ciphertext form of a GSM secret
